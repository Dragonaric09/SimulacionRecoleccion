spring:
  application:
    name: simulacionem
  profiles:
    active: dev
  servlet:
    multipart:
      # Respuestas de encuestas grandes: el límite por defecto de Spring (1 MB) rechaza archivos reales.
      max-file-size: 200MB
      max-request-size: 200MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.jdbc.batch_size: 500
server:
    # Render asigna el puerto en PORT (10000 por defecto); en desarrollo se usa SERVER_PORT.
    port: ${PORT:${SERVER_PORT:8081}}
    # Detrás del proxy de Render, las URLs y redirecciones deben salir con el esquema y host públicos.
    forward-headers-strategy: framework
    error:
      # Las respuestas de error no exponen trazas internas, tampoco en desarrollo con devtools (TRA-010).
      include-stacktrace: never
