spring:
  application:
    name: simulacionem
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/simulacionem}
    username: ${DB_USERNAME:simulacionem_dev}
    password: ${DB_PASSWORD:dev_password_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: dev
  sql:
    init:
      mode: always
      schema-locations: classpath:schema_tss.sql
server:
  port: ${SERVER_PORT:8081}
apps-script:
  empleadores-url: ${APPS_SCRIPT_URL_EMPLEADORES:}
  empleados-url: ${APPS_SCRIPT_URL_EMPLEADOS:}
