spring:
  application:
    name: simulacionem
  datasource:
    url: jdbc:sqlite:./tss_mercado.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: dev
  sql:
    init:
      mode: always
      schema-locations: classpath:schema_tss.sql
server:
  port: ${SERVER_PORT:8081}
apps-script:
  empleadores-url: ${APPS_SCRIPT_URL_EMPLEADORES:}
  empleados-url: ${APPS_SCRIPT_URL_EMPLEADOS:}
