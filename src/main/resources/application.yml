spring:
  application:
    name: simulacionem
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
server:
  port: ${SERVER_PORT:8081}
apps-script:
  empleadores-url: ${APPS_SCRIPT_URL_EMPLEADORES:}
  empleados-url: ${APPS_SCRIPT_URL_EMPLEADOS:}
