services:
  postgres:
    image: postgres:17.6-alpine
    container_name: simulacionem-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: simulacionem
      # Docker Compose lee DB_USER y DB_PASSWORD del archivo .env de esta carpeta (no versionado).
      POSTGRES_USER: ${DB_USER:-simulacionem_dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env (ver .env.example)}
      TZ: America/La_Paz
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d simulacionem"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
